<body>

    </div>

    <header id="main-header">
        <div class="top-bar"><div class="container"><div class="utility-info">
            <span id="weather-widget">Carregando clima...</span>
            <span id="river-level-widget">Rio Negro: Carregando...</span>
        </div></div></div>
        <nav class="navbar"><div class="container"><div class="nav-content">
            <a href="../index.html" class="logo"><h1>Portal <span>Manauara</span></h1></a>
            <ul class="nav-menu">
                <li><a href="categoria.html">Cotidiano</a></li>

                    <input type="text" id="search-input" placeholder="Buscar notícias...">

    <main class="container">
        <header class="category-header"><h1 id="titulo-busca">Resultados</h1></header>
        <div id="resultados-container" class="news-grid"></div>
    </main>

    <footer id="main-footer">
        <div class="container"><div class="footer-bottom"><p>&copy; 2024 Portal Manauara. Todos os direitos reservados.</p></div></div>
    </footer>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/menu.js"></script>
    <script src="../assets/js/search.js"></script>
    <script src="../assets/js/share.js"></script>
    <script>
        var noticias = [
            { id: 'alagamentos-zona-sul', titulo: 'Chuvas fortes causam alagamentos na Zona Sul', desc: 'Temporal deixou ruas intransitáveis no Educandos e Cachoeirinha.', cat: 'Cotidiano', img: '../assets/img/rua_alagada.webp' },
            { id: 'brt-zona-norte', titulo: 'Nova linha de BRT começa a operar na Zona Norte', desc: 'Corredor exclusivo liga o Terminal 5 ao Centro em 25 minutos.', cat: 'Cotidiano', img: '../assets/img/brt_manaus.webp' },
            { id: 'ceasa-recorde', titulo: 'Ceasa bate recorde de vendas em maio', desc: 'Mais de 200 toneladas de frutas regionais comercializadas.', cat: 'Cotidiano', img: '../assets/img/ceasa_manaus.webp' },
            { id: 'eleicoes-2026', titulo: 'Eleições 2026: disputa pelo governo do Amazonas', desc: 'Nomes tradicionais e novas apostas na corrida pelo Palácio Rio Negro.', cat: 'Política', img: '../assets/img/palacio_rio_negro.webp' },
            { id: 'cmm-plano-diretor', titulo: 'CMM aprova novo plano diretor de Manaus', desc: 'Expansão comercial na Zona Norte e novas regras ambientais.', cat: 'Política', img: '../assets/img/cmm_manaus.webp' },
            { id: 'obras-interior', titulo: 'Governo anuncia pacote de R$ 500 mi para o interior', desc: 'Estradas, pontes e escolas em 30 municípios.', cat: 'Política', img: '../assets/img/governo_obras.webp' },
            { id: 'festival-cinema', titulo: 'Festival de Cinema Amazônico com 40 filmes', desc: 'Evento gratuito em junho no Teatro Amazonas.', cat: 'Cultura', img: '../assets/img/teatro_amazonas.webp' },
            { id: 'boi-manaus', titulo: 'Boi Manaus 2026 reúne 200 mil pessoas', desc: 'Três noites de apresentações de bois-bumbás e shows regionais.', cat: 'Cultura', img: '../assets/img/boi_manaus.webp' },
            { id: 'exposicao-indigena', titulo: 'Exposição sobre arte indígena no Palácio Rio Negro', desc: '150 peças de 8 etnias do Amazonas com entrada gratuita.', cat: 'Cultura', img: '../assets/img/arte_indigena.webp' },
            { id: 'mercados-manaus', titulo: 'Guia dos mercados e feiras de Manaus', desc: 'Peixe fresco, frutas amazônicas e artesanato local.', cat: 'Guia Manaus', img: '../assets/img/mercado_adolpho.webp' },
            { id: 'flutuantes-taruma', titulo: '5 melhores flutuantes do Tarumã', desc: 'Lazer nas águas do igarapé mais famoso de Manaus.', cat: 'Guia Manaus', img: '../assets/img/flutuante_taruma.webp' },
            { id: 'roteiro-tambaqui', titulo: 'Onde comer o melhor tambaqui de Manaus', desc: 'Do tradicional na brasa aos pratos autorais.', cat: 'Guia Manaus', img: '../assets/img/tambaqui_prato.webp' },
            { id: 'encontro-aguas', titulo: 'Encontro das Águas bate recorde de visitantes', desc: 'Mais de 120 mil turistas no primeiro trimestre.', cat: 'Turismo', img: '../assets/img/encontro_aguas.webp' },
            { id: 'praia-lua', titulo: 'Praia da Lua é eleita o melhor passeio de Manaus', desc: 'Areia branca às margens do Rio Negro.', cat: 'Turismo', img: '../assets/img/praia_lua.webp' },
            { id: 'passeio-barco', titulo: 'Novo passeio de barco pelo Rio Negro', desc: 'Tour com botos-cor-de-rosa e jantar regional.', cat: 'Turismo', img: '../assets/img/barco_rio_negro.webp' }
        ];

        var params = new URLSearchParams(window.location.search);
        var termo = params.get('q') || '';
        var termoLower = termo.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

        var titulo = document.getElementById('titulo-busca');
        var container = document.getElementById('resultados-container');
        var inputBusca = document.getElementById('search-input');
        if (inputBusca) inputBusca.value = termo;

        if (!termo) {
            titulo.textContent = 'Digite algo para buscar';
        } else {
            var resultados = noticias.filter(function(n) {
                var tudo = (n.titulo + ' ' + n.desc + ' ' + n.cat).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                return tudo.includes(termoLower);
            });
            titulo.textContent = resultados.length + ' resultado(s) para "' + termo + '"';
            if (resultados.length === 0) {
                container.innerHTML = '<p style="grid-column:1/-1;font-size:1.1rem;color:var(--gray-medium);">Nenhuma notícia encontrada. Tente outros termos.</p>';
            } else {
                var html = '';
                resultados.forEach(function(n) {
                    html += '<article class="news-card"><a href="noticia-interna.html?id=' + n.id + '"><div class="card-img"><img src="' + n.img + '" alt="' + n.titulo + '" loading="lazy"></div><div class="card-content"><span class="card-category">' + n.cat + '</span><h3>' + n.titulo + '</h3><p>' + n.desc + '</p></div></a></article>';
                });
                container.innerHTML = html;
            }
        }
    </script>
</body>
</html>
